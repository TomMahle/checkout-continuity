name: CI

on:
  push:
    branches-ignore: [badges]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @continuity/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Publishes the unit test count as a shields.io endpoint file on the
  # `badges` branch, which the README badge reads. Only for main, and only
  # once `check` has passed, so the badge never advertises a failing build.
  badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @continuity/checkout exec vitest run --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"
      - name: Write badge file
        run: |
          mkdir -p "$RUNNER_TEMP/badges"
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            fs.writeFileSync(process.argv[2], JSON.stringify({
              schemaVersion: 1,
              label: "unit tests",
              message: `${r.numPassedTests} passing`,
              color: r.success ? "brightgreen" : "red",
            }));
          ' "$RUNNER_TEMP/vitest.json" "$RUNNER_TEMP/badges/unit-tests.json"
      # A one-commit orphan branch, force-pushed, so it never grows. Pushes made
      # with GITHUB_TOKEN don't trigger workflows, so this can't loop.
      - name: Push to the badges branch
        working-directory: ${{ runner.temp }}/badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git add unit-tests.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update badges for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
