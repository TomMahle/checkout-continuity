packages:
  - apps/*
  - packages/*

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# One React for every package: the shared hook in @continuity/checkout/react
# only works if the apps and the package resolve the very same copy.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
